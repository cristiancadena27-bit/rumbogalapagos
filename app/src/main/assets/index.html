<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumbo a Galápagos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/*
VOICE: alegre y tierno, como un álbum de aventuras para una niña de 11 años.
IDEA: una carta náutica de juguete: la tortuga nada hacia la isla según las casillas ganadas.
PICTURE: mar animado con olas, burbujas, tortuga y la isla de Galápagos con cactus.
COLOUR and TYPE: turquesa del mar, arena, verde cactus, rojizo volcánico; Fredoka redonda.
LAYOUT: una columna de teléfono; escena arriba, casillas, premio, botones grandes.
*/
:root{color-scheme:light;--sea:#0e9aa7;--deep:#0b6e8a;--sand:#fbf0d4;--sandb:#e8c977;--cactus:#4c9a3f;--rust:#c0643a;--coral:#e8604c;--blue:#2f8fd8;--ink:#23302f;--card:#ffffff;--bg:#e9f8f9}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Fredoka,Nunito,"Segoe UI",Roboto,system-ui,sans-serif;overflow-x:clip}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:540px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;gap:12px;margin:4px 2px 12px}
.ava{width:62px;height:62px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 0 3px var(--sea);flex:none;animation:wobble 4s ease-in-out infinite}
.hi{font-weight:700;font-size:26px;line-height:1.05}
.sub{font-weight:600;color:var(--deep);font-size:15px}
.scene{position:relative;height:230px;border-radius:26px;overflow:hidden;background:linear-gradient(#bfe9ff,#e8f9ff 55%);border:4px solid #fff;box-shadow:0 6px 0 #b9e3e8}
.scene>svg:first-child{position:absolute;left:0;bottom:0;width:100%;height:100%}
.wave{animation:waves 6s linear infinite}
.wave2{animation:waves 9s linear infinite reverse}
.sun{animation:spin 30s linear infinite;transform-origin:430px 46px}
.scene .turtle{position:absolute;bottom:34px;width:92px;height:64px;transition:left 1.6s cubic-bezier(.3,1.4,.5,1);animation:swim 2.2s ease-in-out infinite}
.bub{position:absolute;bottom:20px;width:10px;height:10px;border-radius:50%;border:2px solid #fff;opacity:.8;animation:bub 4s linear infinite}
.count{position:absolute;left:14px;top:12px;background:#fff;border-radius:999px;padding:5px 14px;font-weight:700;font-size:18px;color:var(--deep);box-shadow:0 3px 0 #b9e3e8}
.card{background:var(--card);border-radius:24px;padding:16px;margin-top:14px;box-shadow:0 5px 0 #cfe9ec}
.card h2{margin:0 0 10px;font-size:21px;line-height:1.15}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}
.c{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;border:4px solid #bfe3e6;color:#7a8a8a;background:#fff}
.c.p{border-color:var(--rust);color:var(--rust);background:#fff1d6}
.c.on{background:var(--sea);border-color:var(--deep);color:#fff;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.c.p.on{background:var(--rust);border-color:#8f4425;color:#fff}
.c.last{border-color:var(--deep)}
.next{display:flex;gap:14px;align-items:center}
.gift{flex:none;width:64px;height:64px;animation:bounce 2s ease-in-out infinite}
.big{font-weight:700;font-size:20px;line-height:1.2}
.muted{color:#5b6b6b;font-size:15px}
.bar{height:22px;border-radius:999px;background:#e3f3f4;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--sea) 0 14px,#2fb3c0 14px 28px);border-radius:999px;transition:width 1.2s ease;animation:slide 1.5s linear infinite}
.books{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.books span{width:26px;height:26px;border-radius:7px;border:3px solid var(--sandb);background:#fff}
.books span.on{background:var(--sandb);border-color:#b8902c;animation:pop .5s both}
.btns{display:grid;gap:10px;margin-top:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border:0;border-radius:20px;font-weight:700;font-size:19px;background:var(--sea);color:#fff;box-shadow:0 5px 0 var(--deep);cursor:pointer;padding:10px 16px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--deep)}
.btn.alt{background:#fff;color:var(--deep);box-shadow:0 5px 0 #b9e3e8}
.btn.warm{background:var(--coral);box-shadow:0 5px 0 #b8432f}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.view{display:none}
.view.show{display:block;animation:fadeup .35s ease both}
.back{background:none;border:0;font-weight:700;font-size:18px;color:var(--deep);padding:10px 0;min-height:44px;cursor:pointer}
label.f{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=email],input[type=date],input[type=number],select{width:100%;min-height:48px;border-radius:14px;border:3px solid #cfe9ec;padding:8px 12px;font-size:17px;background:#fff}
.step{display:flex;align-items:center;gap:12px;justify-content:center;margin:6px 0}
.step button{width:60px;height:60px;border-radius:50%;border:0;font-size:32px;font-weight:700;background:var(--sand);color:var(--rust);box-shadow:0 4px 0 var(--sandb);cursor:pointer}
.step output{min-width:110px;text-align:center;font-size:54px;font-weight:700;color:var(--deep);line-height:1}
input[type=range]{width:100%;accent-color:var(--sea);height:32px}
.chk{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;border-radius:16px;background:var(--sand);margin-top:10px;font-weight:600}
.chk input{width:26px;height:26px;accent-color:var(--rust);flex:none}
.hint{font-size:15px;font-weight:600;text-align:center;margin-top:4px}
.ok{color:#2e8a3c}.no{color:#b8432f}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:2px dotted #d5e8ea}
.hist .w{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:#e3f3f4;color:var(--deep)}
.hist .w.y{background:var(--sea);color:#fff}
.hist .d{flex:1;font-size:15px;line-height:1.3}
.hist button{border:0;background:none;color:var(--deep);font-weight:700;min-height:44px;min-width:44px;cursor:pointer}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(11,110,138,.55);z-index:20}
.ov.show{display:flex}
.ov canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.pop{position:relative;max-width:420px;width:100%;background:#fff;border-radius:28px;padding:22px 20px;text-align:center;animation:zoom .6s cubic-bezier(.3,1.6,.5,1) both}
.pop h3{margin:6px 0 4px;font-size:30px;line-height:1.1;color:var(--deep)}
.pop p{margin:6px 0}
.pop .t{width:130px;height:90px;animation:dance 1s ease-in-out infinite}
.coupon{margin:12px 0;border:4px dashed var(--rust);border-radius:20px;padding:12px;background:var(--sand);font-weight:700;font-size:20px;color:var(--rust)}
.mail{white-space:pre-wrap;text-align:left;background:#f3fbfb;border-radius:16px;padding:12px;font-size:15px;max-height:200px;overflow:auto;margin:10px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;display:none;z-index:30}
.toast.show{display:block;animation:fadeup .3s both}
.hero{display:block;width:100%;border-radius:20px;margin-top:4px}
@keyframes waves{from{transform:translateX(0)}to{transform:translateX(-120px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes swim{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
@keyframes bub{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-170px) scale(1.2);opacity:0}}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes slide{to{background-position:28px 0}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes zoom{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes dance{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
{
const KEY = 'rumbo-galapagos-v1';
const DEF = {
  name: 'Samira', email: '', firma: 'Papá', start: '2026-11-30', meta: 50, goal: 24, weeksTotal: 30,
  prizes: ['Elijo la cena', 'Noche de película con canguil', 'Helado en familia', 'Premio sorpresa', 'Una salida especial'],
  final: 'Viaje en familia a Galápagos', weeks: {}
};
const FRASES = [
  'Las tortugas llegan lejos porque nunca se detienen.',
  'Un poquito cada día hace cosas gigantes.',
  'Tu esfuerzo de hoy es tu premio de mañana.',
  'Equivocarse está bien; lo importante es volver a intentarlo.',
  'Los hábitos son como semillas: si los cuidas, crecen.',
  'Eres más fuerte y más capaz de lo que crees.',
  'Las grandes aventuras empiezan con pasos pequeños.',
  'Cuando algo cuesta, es porque estás creciendo.',
  'Leer es viajar sin salir de casa.',
  'Ser responsable también es ser valiente.',
  'Hoy lo hiciste genial; mañana lo harás aún mejor.',
  'Tu sonrisa y tu esfuerzo hacen feliz a toda la familia.',
  'Paso a paso, como las tortugas, llegarás a la meta.',
  'Creer en ti es el primer paso para lograrlo.',
  'Lo que haces cada día dice quién eres. ¡Y eres increíble!'
];
const $ = (id) => document.getElementById(id);
let S;
function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { d = null; }
  S = Object.assign({}, DEF, d || {});
  S.prizes = (S.prizes && S.prizes.length === 5) ? S.prizes : DEF.prizes.slice();
  S.weeks = S.weeks || {};
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('No se pudo guardar'); } }
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 2200); }

function weekToday() {
  const st = new Date(S.start + 'T00:00:00');
  const n = Math.floor((Date.now() - st.getTime()) / (7 * 864e5)) + 1;
  return Math.max(1, Math.min(S.weeksTotal, n));
}
function weekDate(n) {
  const d = new Date(S.start + 'T00:00:00'); d.setDate(d.getDate() + (n - 1) * 7);
  return d.toLocaleDateString('es-EC', { day: 'numeric', month: 'short' });
}
function casillasOf(weeks) {
  let c = 0;
  for (const k in weeks) { const w = weeks[k]; if (w.stk >= S.meta) c++; if (w.nota) c++; if (w.libro) c++; }
  return Math.min(c, S.goal);
}
function prizeAt(n) { // casilla n -> texto del premio o null
  if (n === S.goal) return S.final;
  if (n % 4 === 0 && n / 4 <= 5) return S.prizes[n / 4 - 1];
  return null;
}
function nextPrize(c) {
  for (let n = c + 1; n <= S.goal; n++) { const p = prizeAt(n); if (p) return { n, p }; }
  return null;
}
function lastWeek() {
  const ks = Object.keys(S.weeks).map(Number).sort((a, b) => a - b);
  return ks.length ? S.weeks[ks[ks.length - 1]] : null;
}

function render() {
  $('hola').textContent = '¡Hola, ' + S.name + '!';
  $('semHoy').textContent = weekToday();
  document.querySelectorAll('.goalN').forEach(e => e.textContent = S.goal);
  const c = casillasOf(S.weeks);
  $('cas').textContent = c;
  const g = $('grid'); let h = '';
  for (let i = 1; i <= S.goal; i++) {
    const p = prizeAt(i);
    h += '<div class="c' + (p ? ' p' : '') + (i === S.goal ? ' last' : '') + (i <= c ? ' on' : '') + '" style="animation-delay:' + (i * 0.04).toFixed(2) + 's">' + (p ? '★' : i) + '</div>';
  }
  g.innerHTML = h;
  const np = nextPrize(c);
  if (np) {
    $('nextPrize').textContent = np.p;
    const f = np.n - c;
    $('nextLeft').textContent = 'Te ' + (f === 1 ? 'falta 1 casilla' : 'faltan ' + f + ' casillas');
  } else {
    $('nextPrize').textContent = '¡' + S.final + '!';
    $('nextLeft').textContent = '¡Lo lograste!';
  }
  $('bar').style.width = Math.round(c / S.goal * 100) + '%';
  // tortuga
  const sc = $('scene'), t = $('turtle');
  const maxX = Math.max(0, sc.clientWidth * 0.74 - 92);
  t.style.left = (8 + maxX * (c / S.goal)) + 'px';
  // lectura
  const lw = lastWeek();
  const book = lw && lw.book ? lw.book : '';
  $('bookName').textContent = book ? 'Leyendo: ' + book : 'Todavía no hay libro anotado';
  const r = lw ? (lw.read || 0) : 0;
  let b = ''; for (let i = 1; i <= 10; i++) b += '<span class="' + (i <= r ? 'on' : '') + '" style="animation-delay:' + (i * .06) + 's"></span>';
  $('books').innerHTML = b;
  let done = 0; for (const k in S.weeks) if (S.weeks[k].libro) done++;
  $('booksDone').textContent = done;
}

// navegación
const views = ['home', 'reg', 'hist', 'set'];
let cur = 'home';
function go(v) {
  cur = v;
  views.forEach(x => $('v-' + x).classList.toggle('show', x === v));
  window.scrollTo(0, 0);
  if (v === 'reg') openReg();
  if (v === 'hist') renderHist();
  if (v === 'set') openSet();
  if (v === 'home') render();
}
window.handleBack = function () {
  if ($('ov').classList.contains('show')) { closeOv(); return true; }
  if (cur !== 'home') { go('home'); return true; }
  return false;
};
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
$('bReg').addEventListener('click', () => go('reg'));
$('bHist').addEventListener('click', () => go('hist'));
$('bSet').addEventListener('click', () => go('set'));

// registro
function setStk(v) {
  v = Math.max(0, Math.min(77, v | 0));
  $('rStk').value = v; $('stkOut').textContent = v;
  const ok = v >= S.meta;
  $('stkHint').textContent = ok ? '¡Semana cumplida! Meta: ' + S.meta : 'Le faltan ' + (S.meta - v) + ' para la meta de ' + S.meta;
  $('stkHint').className = 'hint ' + (ok ? 'ok' : 'no');
}
function fillReg(n) {
  const w = S.weeks[n] || {};
  const lw = lastWeek();
  setStk(w.stk || 0);
  $('rNota').checked = !!w.nota; $('rLibro').checked = !!w.libro;
  $('rBook').value = w.book != null ? w.book : (lw && lw.book ? lw.book : '');
  $('rRead').value = w.read != null ? w.read : (lw ? (lw.read || 0) : 0);
}
function openReg(n) {
  const sel = $('rSem'); let o = '';
  for (let i = 1; i <= S.weeksTotal; i++) o += '<option value="' + i + '">Semana ' + i + ' · ' + weekDate(i) + (S.weeks[i] ? ' ✓' : '') + '</option>';
  sel.innerHTML = o;
  sel.value = n || weekToday();
  fillReg(+sel.value);
}
$('rSem').addEventListener('change', e => fillReg(+e.target.value));
$('rStk').addEventListener('input', e => setStk(+e.target.value));
$('minus').addEventListener('click', () => setStk(+$('rStk').value - 1));
$('plus').addEventListener('click', () => setStk(+$('rStk').value + 1));

let lastMsg = '', lastSubj = '';
$('bSave').addEventListener('click', () => {
  const n = +$('rSem').value;
  const before = casillasOf(S.weeks);
  const rd = Math.max(0, Math.min(10, parseInt($('rRead').value, 10) || 0));
  S.weeks[n] = { stk: +$('rStk').value, nota: $('rNota').checked, libro: $('rLibro').checked, book: $('rBook').value.trim(), read: rd };
  save();
  const after = casillasOf(S.weeks);
  go('home');
  setTimeout(() => celebrate(n, before, after), 500);
});

function prizesBetween(a, b) { const out = []; for (let i = a + 1; i <= b; i++) { const p = prizeAt(i); if (p) out.push(p); } return out; }

function buildMail(n, before, after) {
  const w = S.weeks[n]; const ok = w.stk >= S.meta;
  const fr = FRASES[Math.floor(Math.random() * FRASES.length)];
  const np = nextPrize(after); const won = prizesBetween(before, after);
  let t = '¡Hola, ' + S.name + '!\n\n';
  if (ok) t += '¡Felicitaciones! En la semana ' + n + ' juntaste ' + w.stk + ' stickers y cumpliste tu meta. ¡Pintaste una casilla más!\n';
  else t += 'En la semana ' + n + ' juntaste ' + w.stk + ' stickers. Te faltaron poquitos para llegar a ' + S.meta + ', pero lo que ya ganaste no se pierde. ¡La próxima semana lo logramos!\n';
  if (w.nota) t += '¡Y mejoraste una materia! Eso vale una casilla extra.\n';
  if (w.libro) t += '¡Terminaste un libro! Eso vale una casilla extra.\n';
  t += '\nYa llevas ' + after + ' de ' + S.goal + ' casillas rumbo a Galápagos.\n';
  if (won.length) t += '¡Ganaste un premio: ' + won.join(' y ') + '!\n';
  if (after >= S.goal) t += '¡Llegaste a la meta! ¡' + S.final + '!\n';
  else if (np) t += 'Tu próximo premio es: ' + np.p + '. Te ' + (np.n - after === 1 ? 'falta 1 casilla' : 'faltan ' + (np.n - after) + ' casillas') + '.\n';
  t += '\nFrase de la semana:\n"' + fr + '"\n\nTe quiere mucho,\n' + S.firma;
  lastSubj = ok ? '¡Felicitaciones, ' + S.name + '! Semana ' + n + ' cumplida' : '¡Vamos, ' + S.name + '! Tu semana ' + n;
  lastMsg = t;
}

function celebrate(n, before, after) {
  const w = S.weeks[n]; const ok = w.stk >= S.meta;
  const won = prizesBetween(before, after);
  buildMail(n, before, after);
  $('popT').textContent = after >= S.goal ? '¡Llegaste a Galápagos!' : won.length ? '¡Ganaste un premio!' : ok ? '¡Semana cumplida!' : '¡Buen intento!';
  $('popP').textContent = ok ? w.stk + ' stickers · ¡una casilla más!' : w.stk + ' stickers. ¡La próxima semana lo logras!';
  const pc = $('popC');
  if (won.length) { pc.style.display = 'block'; pc.textContent = 'Cupón: ' + won.join(' + '); } else pc.style.display = 'none';
  $('popMail').style.display = 'none'; $('bCopy').style.display = 'none';
  openOv(ok || won.length > 0);
}
function openOv(party) { $('ov').classList.add('show'); if (party) confetti(); }
function closeOv() { $('ov').classList.remove('show'); stopConfetti(); }
$('bClose').addEventListener('click', closeOv);

// correo
function sendMail() {
  if (!lastMsg) {
    const ks = Object.keys(S.weeks).map(Number).sort((a, b) => a - b);
    if (!ks.length) { toast('Primero registra una semana'); return; }
    const n = ks[ks.length - 1];
    const prev = Object.assign({}, S.weeks); delete prev[n];
    buildMail(n, casillasOf(prev), casillasOf(S.weeks));
  }
  if (!S.email) toast('Agrega el correo en Ajustes');
  if (window.Android && window.Android.sendEmail) {
    window.Android.sendEmail(S.email || '', lastSubj, lastMsg);
  } else {
    $('popMail').textContent = lastMsg; $('popMail').style.display = 'block';
    $('bCopy').style.display = 'flex';
    if (!$('ov').classList.contains('show')) { $('popT').textContent = 'Tu mensaje'; $('popP').textContent = ''; $('popC').style.display = 'none'; openOv(false); }
    try { window.location.href = 'mailto:' + encodeURIComponent(S.email || '') + '?subject=' + encodeURIComponent(lastSubj) + '&body=' + encodeURIComponent(lastMsg); } catch (e) {}
  }
}
$('bMail').addEventListener('click', sendMail);
$('bMailHome').addEventListener('click', () => { lastMsg = ''; sendMail(); });
$('bCopy').addEventListener('click', () => {
  try { navigator.clipboard.writeText(lastMsg).then(() => toast('Mensaje copiado'), () => toast('No se pudo copiar')); } catch (e) { toast('No se pudo copiar'); }
});

// historial
function renderHist() {
  const ks = Object.keys(S.weeks).map(Number).sort((a, b) => b - a);
  if (!ks.length) { $('histList').innerHTML = '<li><div class="d">Aún no hay semanas registradas.</div></li>'; return; }
  $('histList').innerHTML = ks.map(k => {
    const w = S.weeks[k]; const ok = w.stk >= S.meta;
    const ex = [w.nota ? 'nota +1' : '', w.libro ? 'libro +1' : ''].filter(Boolean).join(' · ');
    return '<li><div class="w' + (ok ? ' y' : '') + '">S' + k + '</div><div class="d"><b>' + w.stk + ' stickers</b> ' + (ok ? '· cumplida' : '· no llegó') + '<br>' + weekDate(k) + (ex ? ' · ' + ex : '') + '</div><button type="button" data-ed="' + k + '">Editar</button></li>';
  }).join('');
  $('histList').querySelectorAll('[data-ed]').forEach(b => b.addEventListener('click', () => { go('reg'); $('rSem').value = b.dataset.ed; fillReg(+b.dataset.ed); }));
}

// ajustes
const P = ['sP1', 'sP2', 'sP3', 'sP4', 'sP5'];
function openSet() {
  $('sName').value = S.name; $('sMail').value = S.email; $('sFirma').value = S.firma; $('sStart').value = S.start;
  $('sMeta').value = S.meta; $('sGoal').value = S.goal; P.forEach((id, i) => $(id).value = S.prizes[i]); $('sFinal').value = S.final;
  $('restoreBox').style.display = 'none';
}
$('bSaveSet').addEventListener('click', () => {
  S.name = $('sName').value.trim() || 'Samira'; S.email = $('sMail').value.trim(); S.firma = $('sFirma').value.trim() || 'Papá';
  S.start = $('sStart').value || DEF.start; S.meta = Math.max(1, Math.min(77, parseInt($('sMeta').value, 10) || 50));
  S.goal = Math.max(4, Math.min(60, parseInt($('sGoal').value, 10) || 24));
  S.prizes = P.map((id, i) => $(id).value.trim() || DEF.prizes[i]); S.final = $('sFinal').value.trim() || DEF.final;
  save(); toast('Ajustes guardados'); go('home');
});
$('bBackup').addEventListener('click', () => {
  const txt = JSON.stringify(S);
  if (window.Android && window.Android.share) { window.Android.share(txt); return; }
  try { navigator.clipboard.writeText(txt).then(() => toast('Respaldo copiado'), () => toast('No se pudo copiar')); } catch (e) { toast('No se pudo copiar'); }
});
$('bRestore').addEventListener('click', () => { $('restoreBox').style.display = 'block'; });
$('bRestoreGo').addEventListener('click', () => {
  try { const d = JSON.parse($('restoreTxt').value); if (!d || typeof d.weeks !== 'object') throw 0; S = Object.assign({}, DEF, d); save(); toast('Respaldo restaurado'); go('home'); }
  catch (e) { toast('Ese respaldo no es válido'); }
});

// confeti
let raf = 0;
function confetti() {
  const cv = $('confetti'), ctx = cv.getContext('2d');
  const W = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
  const cols = ['#0e9aa7', '#e8c977', '#7cc36a', '#e8604c', '#2f8fd8', '#ffd166'];
  const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: -20 - Math.random() * H * .6, r: 5 + Math.random() * 7, c: cols[(Math.random() * cols.length) | 0], vy: 2 + Math.random() * 3.5, vx: -1.5 + Math.random() * 3, a: Math.random() * 6.28, va: -.2 + Math.random() * .4 }));
  const t0 = performance.now();
  cancelAnimationFrame(raf);
  const step = (t) => {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.y += p.vy; p.x += p.vx; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (t - t0 < 4500) raf = requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H);
  };
  raf = requestAnimationFrame(step);
}
function stopConfetti() { cancelAnimationFrame(raf); const cv = $('confetti'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }

const ro = new ResizeObserver(() => render());
load();
render();
ro.observe($('scene'));
}
</script>
